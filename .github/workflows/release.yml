name: Release
# Runs the full gate against a pushed tag. Release notes are authored by hand
# per the org release template — this workflow deliberately does not create a
# GitHub release, so tags never surface as bare auto-generated stubs.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
